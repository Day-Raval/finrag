# Configuration file for the financial data processing project.
corpus:
  years: [2021, 2022]
  tickers: [AMD, BA, AXP, PEP, MMM, VZ, CVS, AES, JNJ, GLW, LMT, KO, AWK, GIS, PFE]
  raw_dir: data/raw
  parsed_dir: data/parsed
  manifest: data/manifest.csv
# Configuration for corpus and data directories.
chunking: {strategy: fixed, size: 512, overlap: 64}
embedding: {provider: local, model: BAAI/bge-small-en-v1.5}
retrieval: {top_k: 5, hybrid: false, rerank: false}
# Configuration for generation and evaluation of financial data.
generation: {provider: groq, model: openai/gpt-oss-120b, prompt: prompts/answer_v1.md, temperature: 0}
judge: {provider: groq, model: openai/gpt-oss-20b, temperature: 0, reasoning_effort: high, max_tokens: 1024}
bulk: {provider: groq, model: openai/gpt-oss-20b}
# golden data configuration
golden:
  path: evals/golden.jsonl
  custom: evals/custom.jsonl
  financebench_dir: data/financebench
# Configuration for indexing, retrieval, and evaluation of financial data.
index:
  chunks: data/index/chunks.jsonl
  qdrant_path: data/index/qdrant
  collection: fixed_512_64
runs_dir: reports/runs
